name: 3D Game Validation
on:
  push:
    branches: [main, feature/full-character-animation-combat, feature/professional-characters-assets, feature/aasma-stage2-living-world-gameplay]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair awardXP source scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old="""function awardXP(amount){
            const n=Math.max(0,Math.floor(amount||0)); s.xp+=n; say('You earn '+n+' XP.');
            while(s.xp>=s.level*30){s.xp-=s.level*30;s.level++;s.maxHp+=18;s.maxMp+=8;s.hp=s.maxHp;s.mp=s.maxMp;say('Level up! You are now level '+s.level+'. Your HP and MP have increased.');}
            render();persist();
          }"""
          new="""function awardXP(amount){
            const state=window.AAsmaGameState?.();
            const log=window.AAsmaSay;
            const renderGame=window.AAsmaRender;
            const persistGame=window.AAsmaPersist;
            if(!state)return;
            const n=Math.max(0,Math.floor(amount||0));
            state.xp+=n;
            log?.('You earn '+n+' XP.');
            while(state.xp>=state.level*30){
              state.xp-=state.level*30;
              state.level++;
              state.maxHp+=18;
              state.maxMp+=8;
              state.hp=state.maxHp;
              state.mp=state.maxMp;
              log?.('Level up! You are now level '+state.level+'. Your HP and MP have increased.');
            }
            renderGame?.();
            persistGame?.();
          }"""
          if old not in text:
              if "const state=window.AAsmaGameState?.();" not in text:
                  raise SystemExit('Expected broken awardXP source was not found; refusing to modify index.html')
              print('awardXP source already repaired')
          else:
              text=text.replace(old,new,1)
              marker="  })();\n  window.AAsmaRuntime="
              if marker not in text:
                  marker="})();\nwindow.AAsmaRuntime="
              if marker not in text:
                  raise SystemExit('Runtime boundary not found; refusing to modify index.html')
              expose="""  window.AAsmaGameState=()=>s;
  window.AAsmaSay=say;
  window.AAsmaPersist=persist;
  window.AAsmaRender=render;
"""
              text=text.replace(marker, expose+marker,1)
              p.write_text(text,encoding='utf-8')
              print('awardXP source repaired')
          PY
          if git diff --quiet -- index.html; then
            echo 'No source repair commit needed.'
          else
            if grep -q "s.xp+=n" index.html; then echo 'ERROR: broken awardXP reference remains'; exit 1; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: repair awardXP runtime state scope"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate embedded JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const matches=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)];
          for(let i=0;i<matches.length;i++){const attrs=matches[i][1]||'',code=matches[i][2];if(!code.trim())continue;try{if(/type=["'](?:module|importmap)["']/i.test(attrs))console.log('module script',i,'deferred');else{new Function(code);console.log('script',i,'syntax OK')}}catch(e){console.error('script',i,e);process.exitCode=1}}
          if(!fs.existsSync('assets/stage2/aasma-stage2.js')||!html.includes('assets/stage2/aasma-stage2.js'))process.exitCode=1;
          if(!html.includes('three@0.160.0')||!html.includes('AAsmaGLTFLoader')||!html.includes('Quaternius')||!html.includes('assets/characters/outfits/Male_Knight_Body_Armor.gltf')||!html.includes('assets/characters/outfits/Male_Noble_Body.gltf')||!html.includes('assets/characters/outfits/Male_Wizard_Body.gltf'))process.exitCode=1;
          NODE
          node --check assets/stage2/aasma-stage2.js
      - name: Browser smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 & SERVER=$!
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1280,height:800}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});await p.waitForSelector('#threeCanvas');await p.waitForFunction(()=>window.__AASMA_IMPORTED_ASSET_READY__===true&&window.__AASMA_OUTFIT_READY__===true,{timeout:30000});await p.waitForFunction(()=>document.querySelectorAll('#s2Races button').length===6,{timeout:15000});if(errors.length)throw new Error('Browser page errors: '+errors.join(' | '));
          const xpBefore=await p.evaluate(()=>{const state=window.AAsmaRuntime.getState();return {xp:state.xp,level:state.level,storage:localStorage.getItem('rebornGameState')}});window.__xpBefore=xpBefore;
          await p.evaluate(()=>window.AAsmaRuntime.awardXP(7));await p.waitForTimeout(100);const xpAfter=await p.evaluate(()=>{const state=window.AAsmaRuntime.getState();return {xp:state.xp,level:state.level,ui:document.querySelector('#xpText')?.textContent||'',storage:localStorage.getItem('rebornGameState')}});if(xpAfter.xp!==xpBefore.xp+7||!xpAfter.ui||xpAfter.storage===xpBefore.storage)throw new Error('Real awardXP state/UI/persistence test failed');
          for(const race of ['Hero','Demon','Elf','Fairy','Noble','Wizard']){await p.click('[data-race="'+race+'"]');await p.waitForTimeout(300);await p.screenshot({path:'aasma-character-preview-'+race.toLowerCase()+'.png',fullPage:true})}
          await p.click('[data-outfit2="Wizard"]');await p.click('[data-w="Crystal Staff"]');await p.click('[data-a="Fairy Halo"]');const custom=await p.evaluate(()=>({outfit:window.AAsmaRuntime.getOutfit(),weapon:!!window.AAsmaRuntime.player()?.root.userData.stage2Weapon,accessory:!!window.AAsmaRuntime.player()?.root.userData.stage2Accessory}));if(custom.outfit!=='Wizard'||!custom.weapon||!custom.accessory)throw new Error('Customization/equipment failed');
          await p.click('[data-s2act="cast"]');await p.click('[data-s2act="special"]');await p.click('#s2Book');await p.click('#s2Library');await p.click('#s2School');await p.click('#s2Kingdom');await p.click('[data-pet="Moon Fox"]');await p.click('[data-summon="Wolf"]');await p.click('[data-q="grove"]');await p.click('[data-q="exam"]');await p.click('[data-skill="Flame Lance"]');const systems=await p.evaluate(()=>({summary:document.querySelector('#s2Summary')?.textContent||'',pet:document.querySelector('[data-pet="Moon Fox"]')?.classList.contains('active'),summon:(document.querySelector('#s2PetState')?.textContent||'').includes('Summon: Wolf'),skill:document.querySelector('[data-skill="Flame Lance"]')?.classList.contains('active')}));if(!systems.summary.includes('Level')||!systems.pet||!systems.summon||!systems.skill)throw new Error('Gameplay systems failed');
          const before=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});await p.dispatchEvent('[data-move="forward"]','pointerdown');await p.waitForTimeout(400);await p.dispatchEvent('[data-move="forward"]','pointerup');const after=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});if(!before||!after||(Math.abs(after.x-before.x)+Math.abs(after.z-before.z)<.001))throw new Error('Desktop third-person movement failed');
          await p.setViewportSize({width:390,height:844});const mb=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});await p.dispatchEvent('[data-move="right"]','pointerdown');await p.waitForTimeout(300);await p.dispatchEvent('[data-move="right"]','pointerup');const ma=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});if(!mb||!ma||(Math.abs(ma.x-mb.x)+Math.abs(ma.z-mb.z)<.001))throw new Error('Mobile touch movement failed');
          console.log('Browser validation OK: real awardXP state/UI/persistence, six character screenshots, customization, shop/inventory, pets/summons, magic, quests, XP/skills, desktop movement and mobile touch controls. Multiplayer remains separately unverified.');await p.close();await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $SERVER || true
      - name: Upload character preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aasma-character-preview
          path: aasma-character-preview-*.png
          if-no-files-found: ignore
