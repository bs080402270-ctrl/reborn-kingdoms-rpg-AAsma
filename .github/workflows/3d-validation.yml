name: 3D Game Validation
on:
  push:
    branches: [main, feature/full-character-animation-combat, feature/professional-characters-assets, feature/aasma-stage2-living-world-gameplay]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate embedded JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('index.html','utf8');
          const matches=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)];
          for(let i=0;i<matches.length;i++){const attrs=matches[i][1]||'',code=matches[i][2];if(!code.trim())continue;try{if(/type=["'](?:module|importmap)["']/i.test(attrs))console.log('module script',i,'deferred');else{new Function(code);console.log('script',i,'syntax OK')}}catch(e){console.error('script',i,e);process.exitCode=1}}
          if(!fs.existsSync('assets/stage2/aasma-stage2.js')||!html.includes('assets/stage2/aasma-stage2.js'))process.exitCode=1;
          if(!html.includes('three@0.160.0')||!html.includes('new T.Skeleton')||!html.includes('AAsmaGLTFLoader')||!html.includes('Quaternius')||!html.includes('assets/characters/outfits/Male_Knight_Body_Armor.gltf')||!html.includes('assets/characters/outfits/Male_Noble_Body.gltf')||!html.includes('assets/characters/outfits/Male_Wizard_Body.gltf'))process.exitCode=1;
          NODE
          node --check assets/stage2/aasma-stage2.js
      - name: Browser smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 &
          SERVER=$!
          node - <<'NODE'
          const {chromium}=require('playwright');
          const base='http://127.0.0.1:4173/index.html';
          const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout after '+ms+'ms')),ms))]);
          async function bootPage(browser,viewport){const p=await browser.newPage({viewport});await p.addInitScript(()=>{window.s=window.s||{xp:0,level:1,maxHp:100,maxMp:50,hp:100,mp:50}});const errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto(base,{waitUntil:'networkidle',timeout:30000});await p.waitForSelector('#threeCanvas');await p.waitForFunction(()=>window.__AASMA_IMPORTED_ASSET_READY__===true&&window.__AASMA_OUTFIT_READY__===true,{timeout:30000});await p.waitForFunction(()=>document.querySelectorAll('#s2Races button').length===6,{timeout:15000});if(errors.length)throw new Error('Browser page errors: '+errors.join(' | '));return p}
          (async()=>{const b=await chromium.launch({headless:true});const p=await bootPage(b,{width:1280,height:800});
            for(const race of ['Hero','Demon','Elf','Fairy','Noble','Wizard']){await p.click('[data-race="'+race+'"]');await p.waitForTimeout(250);await p.screenshot({path:'aasma-character-preview-'+race.toLowerCase()+'.png',fullPage:true})}
            await p.click('[data-outfit2="Wizard"]');await p.click('[data-w="Crystal Staff"]');await p.click('[data-a="Fairy Halo"]');
            const custom=await p.evaluate(()=>({outfit:window.AAsmaRuntime.getOutfit(),weapon:!!window.AAsmaRuntime.player()?.root.userData.stage2Weapon,accessory:!!window.AAsmaRuntime.player()?.root.userData.stage2Accessory}));if(custom.outfit!=='Wizard'||!custom.weapon||!custom.accessory)throw new Error('Character customization/equipment did not apply');
            await p.click('[data-s2act="cast"]');await p.click('[data-s2act="special"]');await p.click('#s2Book');await p.click('#s2Library');await p.click('#s2School');await p.click('#s2Kingdom');await p.click('[data-pet="Moon Fox"]');await p.click('[data-summon="Wolf"]');await p.click('[data-q="grove"]');await p.click('[data-q="exam"]');await p.click('[data-skill="Flame Lance"]');
            const systems=await p.evaluate(()=>({summary:document.querySelector('#s2Summary')?.textContent||'',pet:document.querySelector('[data-pet="Moon Fox"]')?.classList.contains('active'),summon:(document.querySelector('#s2PetState')?.textContent||'').includes('Summon: Wolf'),skill:document.querySelector('[data-skill="Flame Lance"]')?.classList.contains('active')}));if(!systems.summary.includes('Level')||!systems.pet||!systems.summon||!systems.skill)throw new Error('Stage2 shop/inventory/pet/summon/quest/skill systems did not apply');
            const before=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});await p.dispatchEvent('[data-move="forward"]','pointerdown');await p.waitForTimeout(500);await p.dispatchEvent('[data-move="forward"]','pointerup');const after=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});if(!before||!after||(Math.abs(after.x-before.x)+Math.abs(after.z-before.z)<0.001))throw new Error('Third-person forward movement failed');
            const mobile=await bootPage(b,{width:390,height:844});const mb=await mobile.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});await mobile.dispatchEvent('[data-move="right"]','pointerdown');await mobile.waitForTimeout(300);await mobile.dispatchEvent('[data-move="right"]','pointerup');const ma=await mobile.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});if(!mb||!ma||(Math.abs(ma.x-mb.x)+Math.abs(ma.z-mb.z)<0.001))throw new Error('Android/mobile touch movement control failed');await mobile.close();
            let multiplayer='UNVERIFIED';try{await timeout((async()=>{const p1=await bootPage(b,{width:1100,height:760}),p2=await bootPage(b,{width:1100,height:760});let id2='';p2.on('dialog',async d=>{const m=d.message(),match=m.match(/Your Player ID is\s+([^\n]+)/);if(match){id2=match[1].trim();await d.dismiss()}else await d.dismiss()});await p2.click('#pvpConnect');await p2.waitForFunction(()=>!!window.AAsmaRuntime.getPeerId?.(),{timeout:10000});id2=await p2.evaluate(()=>window.AAsmaRuntime.getPeerId());p1.on('dialog',async d=>await d.accept(id2));await p1.click('#pvpConnect');await p1.waitForFunction(()=>window.AAsmaRuntime.connected?.()===true,{timeout:12000});await p2.waitForFunction(()=>window.AAsmaRuntime.connected?.()===true,{timeout:12000});await p1.fill('#s2ChatInput','Hello from Player 1');await p1.click('#s2Send');await p2.waitForFunction(()=>document.querySelector('#s2Chat')?.textContent.includes('Hello from Player 1'),{timeout:5000});await p1.click('#s2Party');await p2.waitForFunction(()=>document.querySelector('#s2Chat')?.textContent.includes('Party invitation received'),{timeout:5000});await p2.click('#s2Ready');await p1.waitForFunction(()=>document.querySelector('#s2Chat')?.textContent.includes('Opponent is READY'),{timeout:5000});const r0=await p2.evaluate(()=>{const x=window.AAsmaRuntime.remotePlayer?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});await p1.dispatchEvent('[data-move="forward"]','pointerdown');await p1.waitForTimeout(700);await p1.dispatchEvent('[data-move="forward"]','pointerup');await p2.waitForTimeout(500);const r1=await p2.evaluate(()=>{const x=window.AAsmaRuntime.remotePlayer?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});if(!r0||!r1||(Math.abs(r1.x-r0.x)+Math.abs(r1.z-r0.z)<0.001))throw new Error('Remote synchronization did not change');await p1.close();await p2.close();multiplayer='VERIFIED'} )(),35000)}catch(e){console.warn('MULTIPLAYER_UNVERIFIED:',String(e))}
            await p.close();await b.close();console.log('Browser validation OK: six character screenshots, customization, shops/inventory, pets/summons, magic, quests/XP/skills, desktop and mobile touch movement. Multiplayer result: '+multiplayer);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $SERVER || true
      - name: Upload character preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aasma-character-preview
          path: aasma-character-preview-*.png
          if-no-files-found: ignore
