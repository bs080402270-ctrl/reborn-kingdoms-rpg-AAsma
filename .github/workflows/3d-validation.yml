name: 3D Game Validation
on:
  push:
    branches: [main, feature/full-character-animation-combat, feature/professional-characters-assets]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate embedded JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const matches=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)];
          for (let i=0;i<matches.length;i++) {
            const attrs=matches[i][1]||'',code=matches[i][2];
            if(!code.trim()) continue;
            try {
              if(/type=["'](?:module|importmap)["']/i.test(attrs)){
                console.log('module script',i,'deferred to browser smoke test');
              }else{
                new Function(code);console.log('script',i,'syntax OK');
              }
            } catch(e) { console.error('script',i,e.stdout?.toString()||e.stderr?.toString()||e); process.exitCode=1; }
          }
          if (!html.includes('three@0.160.0') || !html.includes('new T.Skeleton') || !html.includes('AAsmaGLTFLoader') || !html.includes('Quaternius') || !html.includes('assets/characters/outfits/Male_Knight_Body_Armor.gltf')) process.exitCode=1;
          NODE
      - name: Browser smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 &
          SERVER=$!
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
            await p.waitForSelector('#threeCanvas');
            await p.waitForFunction(()=>window.__AASMA_IMPORTED_ASSET_READY__===true && window.__AASMA_OUTFIT_READY__===true,{timeout:30000});
            for (const race of ['Hero','Demon','Elf','Fairy']) {
              await p.click('[data-race="'+race+'"]');
              await p.waitForTimeout(250);
              await p.screenshot({path:'aasma-character-preview-'+race.toLowerCase()+'.png',fullPage:true});
            }
            for (const anim of ['attack','cast','block','dodge','special','jump','talk','gesture','hit']) {
              await p.click('[data-anim="'+anim+'"]');
              await p.waitForTimeout(120);
            }
            await p.click('[data-move="forward"]');
            const animState=await p.locator('#animState').textContent();
            if(!animState || !animState.includes('imported')) throw new Error('Imported character pipeline did not become active: '+animState);
            if(errors.length){console.error(errors.join('\n'));process.exit(1)}
            console.log('Browser smoke test OK: imported GLB + all four race variants + animation controls active');
            await b.close();
          })();
          NODE
          kill $SERVER || true

      - name: Upload character preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aasma-character-preview
          path: aasma-character-preview-*.png
          if-no-files-found: ignore
