name: 3D Game Validation
on:
  push:
    branches: [main, feature/full-character-animation-combat, feature/professional-characters-assets, feature/aasma-stage2-living-world-gameplay]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate embedded JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const matches=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)];
          for (let i=0;i<matches.length;i++) {
            const attrs=matches[i][1]||'',code=matches[i][2];
            if(!code.trim()) continue;
            try {
              if(/type=["'](?:module|importmap)["']/i.test(attrs)) console.log('module script',i,'deferred to browser smoke test');
              else { new Function(code); console.log('script',i,'syntax OK'); }
            } catch(e) { console.error('script',i,e); process.exitCode=1; }
          }
          if (!fs.existsSync('assets/stage2/aasma-stage2.js')) process.exitCode=1;
          if (!html.includes('assets/stage2/aasma-stage2.js')) process.exitCode=1;
          if (!html.includes('three@0.160.0') || !html.includes('new T.Skeleton') || !html.includes('AAsmaGLTFLoader') || !html.includes('Quaternius') || !html.includes('assets/characters/outfits/Male_Knight_Body_Armor.gltf') || !html.includes('assets/characters/outfits/Male_Noble_Body.gltf') || !html.includes('assets/characters/outfits/Male_Wizard_Body.gltf')) process.exitCode=1;
          NODE
          node --check assets/stage2/aasma-stage2.js
      - name: Browser smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 &
          SERVER=$!
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
            await p.waitForSelector('#threeCanvas');
            await p.waitForFunction(()=>window.__AASMA_IMPORTED_ASSET_READY__===true && window.__AASMA_OUTFIT_READY__===true,{timeout:30000});
            await p.waitForTimeout(500);
            if(errors.length) throw new Error('Browser page errors before Stage2: '+errors.join(' | '));
            await p.waitForFunction(()=>document.querySelectorAll('#s2Races button').length===6,{timeout:10000}).catch(async()=>{throw new Error('Stage2 UI failed to initialize: runtime='+await p.evaluate(()=>!!window.AAsmaRuntime)+' races='+await p.evaluate(()=>document.querySelectorAll('#s2Races button').length)+' summary='+await p.evaluate(()=>document.querySelector('#s2Summary')?.textContent||''));});
            for (const race of ['Hero','Demon','Elf','Fairy','Noble','Wizard']) {
              await p.click('[data-race="'+race+'"]'); await p.waitForTimeout(250); await p.screenshot({path:'aasma-character-preview-'+race.toLowerCase()+'.png',fullPage:true});
            }
            await p.click('[data-outfit2="Wizard"]');
            await p.click('[data-w="Crystal Staff"]');
            await p.click('[data-a="Fairy Halo"]');
            await p.click('[data-s2act="cast"]');
            await p.click('#s2Book'); await p.click('#s2Library'); await p.click('#s2School'); await p.click('#s2Kingdom');
            await p.click('[data-pet="Moon Fox"]'); await p.click('[data-summon="Wolf"]'); await p.click('#q1'); await p.click('#q2');
            const before=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});
            await p.dispatchEvent('[data-move="forward"]','pointerdown'); await p.waitForTimeout(500); await p.dispatchEvent('[data-move="forward"]','pointerup');
            const after=await p.evaluate(()=>{const x=window.AAsmaRuntime.player?.();return x?{x:x.root.position.x,z:x.root.position.z}:null});
            if(!before||!after||(Math.abs(after.x-before.x)+Math.abs(after.z-before.z)<0.001)) throw new Error('Third-person forward movement did not change player position');
            const animState=await p.locator('#animState').textContent(); if(!animState || !animState.includes('imported')) throw new Error('Imported character pipeline did not become active: '+animState);
            const summary=await p.locator('#s2Summary').textContent(); if(!summary || !summary.includes('Level')) throw new Error('Stage2 progression UI did not initialize');
            if(errors.length) throw new Error('Browser page errors: '+errors.join(' | '));
            console.log('Browser smoke test OK: six classes, Stage2 UI, customization, gameplay controls, imported animation and third-person movement active');
            await b.close();
          })();
          NODE
          kill $SERVER || true
      - name: Upload character preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aasma-character-preview
          path: aasma-character-preview-*.png
          if-no-files-found: ignore
