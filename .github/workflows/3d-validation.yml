name: 3D Game Validation
on:
  push:
    branches: [main, feature/full-character-animation-combat]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate embedded JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(s=>s.trim());
          for (let i=0;i<scripts.length;i++) {
            try { new Function(scripts[i]); console.log('script',i,'syntax OK'); }
            catch(e) { console.error('script',i,e); process.exitCode=1; }
          }
          if (!html.includes('three@0.160.0') || !html.includes('new T.Skeleton')) process.exitCode=1;
          NODE
      - name: Browser smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/server.log 2>&1 &
          SERVER=$!
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1280,height:800}});
            const errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle',timeout:30000});
            await p.waitForSelector('#threeCanvas');
            await p.click('[data-race="Demon"]');
            await p.click('[data-anim="attack"]');
            await p.click('[data-anim="cast"]');
            await p.click('[data-anim="block"]');
            await p.click('[data-move="forward"]');
            if(errors.length){console.error(errors.join('\n'));process.exit(1)}
            console.log('Browser smoke test OK');
            await b.close();
          })();
          NODE
          kill $SERVER || true
